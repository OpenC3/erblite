[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erblite"
version = "0.1.0"
description = "A sandboxed template engine using ERB syntax and a subset of Ruby"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
erblite = "erblite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["erblite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.black]
line-length = 120
