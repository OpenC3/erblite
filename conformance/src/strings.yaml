- n: case_methods
  t: "<% s = 'hEllo World' %><%= s.upcase %>|<%= s.downcase %>|<%= s.capitalize %>|<%= s.swapcase %>"
- n: strip_family
  t: "<% s = \"  \\t hi \\n \" %>[<%= s.strip %>][<%= s.lstrip %>][<%= s.rstrip %>]"
- n: chomp_chop
  t: "<%= \"a\\n\".chomp.inspect %>,<%= \"a\\r\\n\".chomp.inspect %>,<%= 'hello'.chomp('lo') %>,<%= 'abc'.chop %>,<%= \"a\\n\\n\".chomp.inspect %>"
- n: length_size
  t: "<%= 'héllo'.length %>,<%= 'abc'.size %>,<%= 'héllo'.bytesize %>,<%= ''.empty? %>"
- n: index_access
  t: "<% s = 'hello' %><%= s[0] %>,<%= s[-1] %>,<%= s[1, 3] %>,<%= s[1..3] %>,<%= s[1...-1] %>,<%= s[10].inspect %>,<%= s[5].inspect %>,<%= s[5, 2].inspect %>,<%= s[2..] %>,<%= s.slice(0, 2) %>"
- n: search
  t: "<% s = 'hello world' %><%= s.include?('lo w') %>,<%= s.start_with?('he', 'x') %>,<%= s.end_with?('x') %>,<%= s.index('o') %>,<%= s.index('o', 5) %>,<%= s.rindex('o') %>,<%= s.index('z').inspect %>"
- n: sub_gsub
  t: "<% s = 'a.b.c' %><%= s.sub('.', '-') %>,<%= s.gsub('.', '-') %>,<%= s.gsub('.', '[\\\\0]') %>,<%= s.gsub('.') { |m| '!' } %>,<%= 'aaa'.gsub('a', 'a' => '1') %>,<%= s.gsub('x', 'y') %>"
- n: gsub_backrefs
  t: "<%= 'abc'.sub('b', '<\\\\`|\\\\&|\\\\\\'>') %>,<%= 'abc'.sub('b', '\\\\\\\\') %>,<%= 'abc'.sub('b', '\\\\1') %>"
- n: split
  t: "<%= 'a,b,,c,,'.split(',').inspect %>|<%= '  a  b c '.split.inspect %>|<%= 'a b'.split(' ').inspect %>|<%= 'abc'.split('').inspect %>|<%= ''.split(',').inspect %>|<%= 'a,b,c'.split(',', 2).inspect %>|<%= 'a,b,,'.split(',', -1).inspect %>|<%= 'a--b--c'.split('--').inspect %>"
- n: justify
  t: "[<%= 'ab'.center(7, '*') %>][<%= 'ab'.ljust(5) %>][<%= 'ab'.rjust(5, '0') %>][<%= 'abc'.center(2) %>][<%= 'ab'.center(6, '12') %>]"
- n: conversions
  t: "<%= '12abc'.to_i %>,<%= '  -42'.to_i %>,<%= 'abc'.to_i %>,<%= '1_000'.to_i %>,<%= 'ff'.to_i(16) %>,<%= '0x1A'.to_i(16) %>,<%= '0x1A'.hex %>,<%= '-ff'.hex %>,<%= '777'.oct %>,<%= '101'.to_i(2) %>,<%= '1.5e3'.to_f %>,<%= '.5'.to_f %>,<%= 'abc'.to_f %>,<%= '3.7xyz'.to_f %>,<%= '1e'.to_f %>"
- n: to_sym_inspect
  t: "<%= 'abc'.to_sym.inspect %>,<%= 'a b'.to_sym.inspect %>,<%= 'x='.to_sym.inspect %>,<%= '+'.to_sym.inspect %>,<%= '9a'.to_sym.inspect %>"
- n: inspect_escapes
  t: "<%= \"q\\\"b\\\\s\\n\\t\\r\\e\\a\\b\\f\\v\\0\\x01\\x7F é\".inspect %>|<%= '#{x} #$y #@z #a'.inspect %>"
- n: chars_lines_bytes
  t: "<%= 'héy'.chars.inspect %>,<%= \"a\\nb\\n\".lines.inspect %>,<%= 'AB'.bytes.inspect %>,<%= 'A'.ord %>,<%= 'é'.ord %>"
- n: reverse_count_tr
  t: "<%= 'abc'.reverse %>,<%= 'hello'.count('l') %>,<%= 'hello'.tr('el', 'ip') %>,<%= 'hello'.tr('a-y', 'b-z') %>,<%= 'hello'.tr('^l', '*') %>,<%= 'hello'.delete('l') %>,<%= 'aaabbb'.squeeze %>,<%= 'hello'.tr('elo', 'x') %>"
- n: each_char
  t: "<% 'abc'.each_char do |c| %>[<%= c %>]<% end %>"
- n: each_line
  t: "<% \"a\\nb\".each_line do |l| %>(<%= l.inspect %>)<% end %>"
- n: partition
  t: "<%= 'a=b=c'.partition('=').inspect %>,<%= 'a=b=c'.rpartition('=').inspect %>,<%= 'abc'.partition('x').inspect %>"
- n: casecmp
  t: "<%= 'abc'.casecmp('ABC') %>,<%= 'abc'.casecmp?('ABC') %>,<%= 'a'.casecmp('b') %>"
- n: string_compare
  t: "<%= 'abc' == 'abc' %>,<%= 'a' <=> 'b' %>,<%= 'b' > 'a' %>,<%= 'a'.between?('a', 'c') %>,<%= ('a' <=> 1).inspect %>"
- n: string_mul_errors
  t: "<%= 'a' * -1 %>"
- n: ascii_only
  t: "<%= 'abc'.ascii_only? %>,<%= 'é'.ascii_only? %>"
- n: shovel_variable
  t: "<% s = 'a' %><% s << 'b' << 'c' %><%= s %>"
- n: shovel_in_hash
  t: "<% h = {k: 'x'} %><% h[:k] << 'y' %><%= h[:k] %>"
- n: shovel_non_string_value
  t: "<% s = 'n' %><% s << 1.to_s %><%= s %>"
- n: string_symbols
  t: "<%= :abc.to_s %>,<%= :abc.length %>,<%= :abc.upcase.inspect %>,<%= :b <=> :a %>,<%= :abc.to_sym.inspect %>,<%= :abc.start_with?('a') %>"
- n: interpolation_inspect
  t: '<%= "#{[1, "a"]} #{{a: "b"}} #{:s} #{1.0}" %>'
- n: freeze_dup
  t: "<% s = 'abc'.freeze %><%= s.frozen? %>,<%= 1.frozen? %>,<%= s.dup %>,<%= nil.frozen? %>"
- n: unicode_upcase
  t: "<%= 'éàü'.upcase %>,<%= 'ÉÀÜ'.downcase %>,<%= 'émile'.capitalize %>"
- n: split_limit_one
  t: "<%= '  pad  '.split(nil, 1).inspect %>,<%= ' a b'.split(' ', 1).inspect %>,<%= ''.split(',', 1).inspect %>,<%= 'a,b'.split('', 1).inspect %>,<%= ' a b '.split(nil, 2).inspect %>,<%= ' a b '.split(nil, -1).inspect %>"
