[package]
name = "erblite"
version = "0.5.0"
edition = "2021"
description = "Sandboxed ERB-syntax template engine running a safe subset of Ruby"
license = "MIT"
repository = "https://github.com/OpenC3/erblite"
readme = "README.md"
keywords = ["template", "erb", "sandbox", "ruby"]
categories = ["template-engine"]
exclude = ["target/", "rustfmt.toml", ".cargo/"]

[lib]
name = "erblite"
path = "src/lib.rs"

[[bin]]
name = "erblite"
path = "src/bin/erblite.rs"

[dependencies]
