# Publishes all three packages when a version tag is pushed:
#
#   ruby tools/version.rb 0.2.0 && git commit -am "Release 0.2.0"
#   git tag v0.2.0 && git push origin main v0.2.0
#
# Publishing uses OIDC trusted publishing (no long-lived secrets). One-time setup:
#   * PyPI:      add a (pending) trusted publisher for project "erblite",
#                repo OpenC3/erblite, workflow release.yml, environment "pypi".
#   * RubyGems:  add a (pending) trusted publisher for gem "erblite",
#                repo OpenC3/erblite, workflow release.yml, environment "rubygems".
#   * crates.io: trusted publishing requires the crate to exist, so for the very
#                first release add a CARGO_REGISTRY_TOKEN secret to the "crates-io"
#                environment. Then configure the trusted publisher (repo OpenC3/erblite,
#                workflow release.yml, environment "crates-io") and delete the secret.
#   * GitHub:    create the environments "pypi", "rubygems" and "crates-io"
#                (optionally with required reviewers to gate releases).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Tag matches package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: ruby tools/version.rb --check "${{ github.ref_name }}"

  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  build-python:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build python --outdir dist
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  build-ruby:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: gem build erblite.gemspec --output "../erblite-${GITHUB_REF_NAME#v}.gem"
        working-directory: ruby
      - uses: actions/upload-artifact@v4
        with:
          name: ruby-gem
          path: "*.gem"
          if-no-files-found: error

  build-rust:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package --manifest-path rust/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: rust-crate
          path: rust/target/package/*.crate
          if-no-files-found: error

  publish-pypi:
    needs: [test, build-python]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/erblite
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-rubygems:
    needs: [test, build-ruby]
    runs-on: ubuntu-latest
    environment:
      name: rubygems
      url: https://rubygems.org/gems/erblite
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ruby-gem
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - run: gem push erblite-*.gem

  publish-crates:
    needs: [test, build-rust]
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/erblite
    permissions:
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.HAS_TOKEN != 'true'
      - run: cargo publish --manifest-path rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

  github-release:
    needs: [publish-pypi, publish-rubygems, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - name: Create GitHub release with the published packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
