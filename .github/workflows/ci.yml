name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    name: Conformance cases up to date
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/conformance/Gemfile
    steps:
      - uses: actions/checkout@v4
      # The oracle must be Ruby 3.4: case expectations use its Hash#inspect format.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Regenerate cases with the Ruby ERB oracle and compare
        run: bundle exec ruby conformance/generate.rb --check
      - name: Package versions are in sync
        run: ruby tools/version.rb
      - name: Package license copies match LICENSE.md
        run: for d in python ruby rust; do cmp LICENSE.md "$d/LICENSE.md"; done

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check erblite tests
          ruff format --check erblite tests
      - run: pytest

  ruby:
    name: Ruby ${{ matrix.ruby }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.2", "3.3", "3.4"]
        include:
          - os: macos-latest
            ruby: "3.4"
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ruby
      - run: bundle exec rake spec

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --release

  difftest:
    name: Differential fuzz (all implementations vs Ruby)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build implementations
        run: |
          python -m venv python/.venv
          python/.venv/bin/pip install -e python
          cargo build --release --manifest-path rust/Cargo.toml
      - name: Fuzz
        run: ruby tools/difftest.rb --count 1500 --seed ${{ github.run_number }}
